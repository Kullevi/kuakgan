<!doctype html>
<!-- Kuakgan dashboard: one 1200x630 frame (the ratio of a link preview image) with the
     cost, tokens per day by model, models, the biggest waste and projects, scaled to the
     window. Served by `kuakgan.py dashboard` on localhost; reads /data.json. The
     Screenshot button has the server draw the same frame. -->
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuakgan</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
/* One visual system: type 12/14/16/20/28/48, an 8 px grid,
   16 px cards with 24 px padding and a 1 px border, and one series palette. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --border: #e6e8ec; --track: #eef0f3;
  --text: #111418; --muted: #5d6673; --faint: #8b929d;
  --accent: #0f9d6b; --warn: #c27a12; --error: #d0453b;
  --s1: #0f9d6b; --s2: #3b6fe0; --s3: #e0882b; --s4: #8a5cf0; --s5: #e0457b; --s6: #1aa6b8; --s7: #9aa3ad;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0d1014; --surface: #151a20; --border: #252c35; --track: #1e242c;
  --text: #eef1f4; --muted: #8b95a3; --faint: #677180;
  --accent: #2fd08b; --warn: #e0a043; --error: #f0675c;
  --s1: #2fd08b; --s2: #6b93f0; --s3: #f0a352; --s4: #a585f5; --s5: #f06a95; --s6: #3cc3d4; --s7: #b4bcc5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font: 400 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
.num { font-variant-numeric: tabular-nums; }

/* The frame is designed at 1200x630 and scaled to fit the window, centred. */
.frame { position: absolute; left: 50%; top: 50%; width: 1200px; height: 630px; padding: 32px;
  transform: translate(-50%, -50%) scale(var(--scale, 1)); display: grid; gap: 24px;
  grid-template-rows: 40px minmax(0, 1fr); }
header { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 12px; flex: none; }
.brand img { width: 32px; height: 32px; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.scope { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.site { color: var(--muted); font-size: 14px; display: none; }
.body { display: grid; gap: 24px; min-height: 0; grid-template-columns: 360px minmax(0, 1fr); }
.right { display: grid; gap: 24px; min-height: 0; grid-template-rows: minmax(0, 1fr) 200px; }
.pair { display: grid; gap: 24px; grid-template-columns: 1fr 1fr; min-height: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px;
  min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card-head { display: flex; align-items: center; gap: 16px; height: 24px; flex: none; margin-bottom: 16px; }
.list { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
.more, .empty, .count { color: var(--muted); font-size: 12px; }

/* Controls */
.tools { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; background: var(--track); border-radius: 8px; padding: 2px; }
.seg button { white-space: nowrap; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; height: 24px; padding: 0 10px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); }
select, .btn { font: inherit; font-weight: 600; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; height: 28px; padding: 0 10px; cursor: pointer; max-width: 180px; }
.btn { display: inline-flex; align-items: center; gap: 6px; }
.btn:hover, select:hover { border-color: var(--faint); }
.btn:disabled { cursor: progress; opacity: .7; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.shot-mode .tools { display: none; }
.shot-mode .site { display: block; }

/* Summary: the headline, three numbers and the models, whose colours are the chart's legend */
.headline { font-size: 48px; font-weight: 650; line-height: 1.1; letter-spacing: -.02em; margin-top: 8px; }
.subline { color: var(--muted); font-size: 14px; margin-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 24px 0; padding: 16px 0;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); flex: none; }
.stat b { display: block; font-size: 20px; font-weight: 650; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 12px; }
.stat.warn b { color: var(--warn); }
.strip { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin: 8px 0 16px; flex: none; background: var(--track); }
.strip i { display: block; height: 100%; }
.item { display: flex; align-items: center; gap: 8px; height: 20px; flex: none; font-size: 14px; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.item .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .v { color: var(--muted); white-space: nowrap; }
.item .v b { color: var(--text); font-weight: 600; }

/* Chart */
#chart { flex: 1; min-height: 0; }
#chart svg { display: block; overflow: visible; }
#chart text { fill: var(--faint); font-size: 12px; }

/* Waste and projects */
.finding { flex: none; }
.finding .top { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.finding .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.finding .cost { color: var(--warn); font-weight: 650; white-space: nowrap; }
.finding .tip { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
code { font: 600 1em ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--text); }
.bar { height: 4px; background: var(--track); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.place { flex: none; }
.place .item { height: 20px; }

/* While new numbers load: a moving bar along the top. */
body::after { content: ""; position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent); z-index: 10; }
body.busy::after { animation: loadbar 1.6s ease-in-out infinite; }
@keyframes loadbar { 0% { left: 0; width: 0; } 50% { left: 20%; width: 60%; } 100% { left: 100%; width: 0; } }
.loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--muted); z-index: 5; text-align: center; }
.status.bad { color: var(--error); font-weight: 600; }

/* A phone or a narrow window: the cards stack and the page scrolls. */
body.narrow { overflow: auto; }
.narrow .frame { position: static; transform: none; width: auto; height: auto; padding: 16px; grid-template-rows: auto auto; }
.narrow header { flex-wrap: wrap; }
.narrow header > .tools { flex-wrap: wrap; width: 100%; }
.narrow .body, .narrow .pair { grid-template-columns: minmax(0, 1fr); }
.narrow .right { grid-template-rows: 280px auto; }
.narrow .list { overflow: visible; }
</style>
</head>
<body>
<div class="loading" id="loading"><div>Reading your Claude Code and Codex logs…<br><span style="font-size:12px">The first time can take a few minutes; after that it is quick.</span></div></div>
<main class="frame">
  <header>
    <div class="brand"><img src="/logo.svg" alt=""><h1>Kuakgan</h1></div>
    <span class="scope" id="scope"></span>
    <span class="spacer"></span>
    <div class="tools">
      <span class="status num" id="status" aria-live="polite"></span>
      <div class="seg" id="period"><button data-days="1">Today</button><button data-days="7">7 days</button><button data-days="30">30 days</button></div>
      <select id="project" aria-label="Project"><option value="">All projects</option></select>
      <button class="btn" id="private" type="button" aria-pressed="false" title="Numbers projects, sessions and machines instead of naming them, so the window can be shown">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>Private</button>
      <button class="btn" id="shot" type="button" title="Copies a 1200x630 picture of this view, ready to paste into a post or a chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg><span id="shot-text">Screenshot</span></button>
    </div>
    <span class="site">github.com/Kullevi/kuakgan</span>
  </header>
  <div class="body">
    <section class="card">
      <div class="label">Estimated cost</div>
      <div class="headline num" id="headline">–</div>
      <div class="subline num" id="subline"></div>
      <div class="stats" id="stats"></div>
      <div class="label">Models</div>
      <div class="strip" id="strip"></div>
      <div class="list" id="models"></div>
    </section>
    <div class="right">
      <section class="card">
        <div class="card-head"><span class="label" id="chart-title">Tokens per day</span><span class="spacer"></span>
          <div class="seg tools" id="metric"><button data-m="tokens">Tokens</button><button data-m="cost">Cost</button></div></div>
        <div id="chart"></div>
      </section>
      <div class="pair">
        <section class="card"><div class="card-head"><span class="label">Biggest waste</span><span class="spacer"></span><span class="count" id="findings-count"></span></div><div class="list" id="findings"></div></section>
        <section class="card"><div class="card-head"><span class="label" id="where-title">Projects</span><span class="spacer"></span><span class="count" id="where-count"></span></div><div class="list" id="where"></div></section>
      </div>
    </div>
  </div>
</main>

<script>
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6"], OTHER = "--s7";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const query = new URLSearchParams(location.search);
const shotMode = query.get("shot") === "1";  // the copy the server draws for the Screenshot button
if (shotMode) document.body.classList.add("shot-mode");

const stored = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const store = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const state = {
  days: [1, 7, 30].includes(+query.get("days")) ? +query.get("days") : 30,
  project: query.get("project") || "",
  metric: query.get("metric") === "cost" ? "cost" : "tokens",
  private: query.has("private") ? query.get("private") === "1" : stored("kuakgan.private") === "1",
  data: null,
  projectList: [],  // every project in the period, kept while one of them is chosen
};

// Light or dark follows the system, unless the address asks for one (the screenshot does).
const dark = matchMedia("(prefers-color-scheme: dark)");
function theme() {
  const t = query.get("theme") || (dark.matches ? "dark" : "light");
  document.documentElement.dataset.theme = t;
  return t;
}
theme();
dark.addEventListener("change", () => { theme(); if (state.data) render(); });

function fmt(n) {
  if (n == null) return "–";
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(a >= 1e10 ? 0 : 1) + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e4 ? 0 : 1) + "k";
  return String(Math.round(n));
}
function money(n) {
  if (n == null) return "–";
  if (n >= 1000) return "$" + Math.round(n).toLocaleString("en-US");
  if (n >= 10) return "$" + n.toFixed(0);
  return "$" + n.toFixed(2);
}
const pct = (x) => (x * 100).toFixed(x < 0.1 ? 1 : 0) + "%";
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

// Private mode replaces everything that could say what someone works on: project, session
// and machine names. Model names, numbers and the general fixes stay.
function names() {
  const projects = {};
  state.projectList.forEach((p, i) => projects[p] = `Project ${i + 1}`);
  return { project: (p) => state.private ? (projects[p] || "Another project") : p };
}

// The frame keeps its 1200x630 design and is scaled to the window.
function fit() {
  const narrow = innerWidth < 720 && !shotMode;
  document.body.classList.toggle("narrow", narrow);
  document.documentElement.style.setProperty("--scale", narrow ? 1 : Math.min(innerWidth / 1200, innerHeight / 630));
}

// Shows as many whole items as fit, and says how many more there are.
// The count goes in the card's head when one is given, so the list keeps its room.
function fill(box, items, more, countBox, count) {
  box.innerHTML = items.join("");
  if (countBox) countBox.textContent = items.length > 1 ? count(items.length) : "";
  if (document.body.classList.contains("narrow")) return;
  let shown = items.length;
  while (shown > 1 && box.scrollHeight > box.clientHeight + 1) {
    shown--;
    box.innerHTML = items.slice(0, shown).join("") + (more ? `<div class="more">${more(items.length - shown)}</div>` : "");
  }
}

let loadNumber = 0;
async function load() {
  const mine = ++loadNumber;  // a slower, older answer must not replace a newer one
  const q = new URLSearchParams({ days: state.days });
  if (state.project) q.set("project", state.project);
  document.body.classList.add("busy");
  try {
    // Opened on one project: the whole list first, so Private mode can number it.
    if (state.project && !state.projectList.length) {
      const all = await fetch("/data.json?days=" + state.days, { cache: "no-store" }).then((r) => r.json());
      state.projectList = all.projects.map((p) => p.project);
    }
    const res = await fetch("/data.json?" + q, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (mine !== loadNumber) return;
    state.data = data;
    if (!state.project) state.projectList = data.projects.map((p) => p.project);
    $("loading").style.display = "none";
    $("status").classList.remove("bad");
    $("status").textContent = "";
    render();
  } catch (e) {
    if (mine === loadNumber) { $("status").textContent = "Not answering"; $("status").classList.add("bad"); }
  } finally {
    if (mine === loadNumber) document.body.classList.remove("busy");
  }
}

function colors() {
  // In the order of the models list, so its first colours are the chart's biggest series.
  const css = getComputedStyle(document.documentElement);
  const order = [...new Set([...state.data.models.map((m) => m.model), ...state.data.days.map((r) => r.model)])];
  const color = {};
  order.forEach((m, i) => color[m] = css.getPropertyValue(i < SERIES.length ? SERIES[i] : OTHER).trim());
  return { order, color };
}

function render() {
  const d = state.data, t = d.totals, nm = names();
  const days = d.period_days;
  const when = days === 1 ? "Last 24 hours" : `Last ${days} days`;
  const date = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  $("scope").textContent = [when, state.project ? nm.project(state.project) : "All projects", shotMode ? date : ""].filter(Boolean).join(" · ");
  $("headline").textContent = money(t.cost);
  $("subline").textContent = `${fmt(t.tokens)} tokens at API list prices` + (t.tokens_without_price ? `, plus ${fmt(t.tokens_without_price)} without a price` : "");
  const stat = (v, k, cls = "") => `<div class="stat ${cls}"><b class="num">${v}</b><span>${k}</span></div>`;
  $("stats").innerHTML = stat(fmt(t.sessions), "sessions") + stat(fmt(t.model_calls), "model calls") +
    stat(pct(t.waste_share), t.waste_cost ? `wasted · ${money(t.waste_cost)}` : "steps wasted", "warn");
  const list = state.projectList.includes(state.project) || !state.project ? state.projectList : [state.project, ...state.projectList];
  $("project").innerHTML = `<option value="">All projects</option>` + list.map((p) => `<option value="${esc(p)}">${esc(nm.project(p))}</option>`).join("");
  $("project").value = state.project;
  renderModels(); renderChart(); renderFindings(); renderWhere();
}

function renderModels() {
  const ms = state.data.models, { color } = colors();
  const total = ms.reduce((a, m) => a + m.tokens, 0) || 1;
  $("strip").innerHTML = ms.filter((m) => m.tokens / total >= .004)
    .map((m) => `<i style="flex:${m.tokens};background:${color[m.model]}" title="${esc(m.model)}"></i>`).join("");
  if (!ms.length) { $("models").innerHTML = `<div class="empty">No model calls in this period.</div>`; return; }
  fill($("models"), ms.map((m) => `<div class="item" title="${esc(m.model)} · ${m.source} · ${fmt(m.requests)} calls">
    <span class="dot" style="background:${color[m.model]}"></span><span class="name">${esc(m.model)}</span>
    <span class="v num"><b>${fmt(m.tokens)}</b> · ${m.priced === false ? "no price" : money(m.cost)}</span></div>`),
    (n) => `and ${n} more model${n > 1 ? "s" : ""}`);
}

function renderChart() {
  const rows = state.data.days, m = state.metric, box = $("chart");
  $("chart-title").textContent = (m === "cost" ? "Cost per " : "Tokens per ") + (state.data.step === "hour" ? "hour" : "day");
  const { order, color } = colors();
  // A day is shown hour by hour (keys in UTC, labels in local time); longer periods by day.
  const hourly = state.data.step === "hour", len = hourly ? 13 : 10, unit = hourly ? 3600000 : 86400000;
  const now = new Date(), last = new Date(now.toISOString().slice(0, len) + (hourly ? ":00:00Z" : "T00:00:00Z"));
  const n = hourly ? 24 : state.data.period_days;
  const buckets = [];
  for (let i = n - 1; i >= 0; i--) buckets.push(new Date(last.getTime() - i * unit).toISOString().slice(0, len));
  const val = (r) => (m === "cost" ? r.cost || 0 : r.tokens);
  const stack = {}; buckets.forEach((k) => stack[k] = {});
  rows.forEach((r) => { if (stack[r.day]) stack[r.day][r.model] = (stack[r.day][r.model] || 0) + val(r); });
  const sums = buckets.map((k) => Object.values(stack[k]).reduce((a, b) => a + b, 0));
  // Round steps on the axis: 1, 2, 2.5 or 5 times a power of ten, three or four of them.
  const top = Math.max(...sums, 1e-9);
  const p10 = 10 ** Math.floor(Math.log10(top / 3));
  const step = [1, 2, 2.5, 5, 10].map((f) => f * p10).find((x) => x * 4 >= top);
  const ticks = Math.ceil(top / step), max = ticks * step;
  const W = box.clientWidth, H = box.clientHeight;
  if (!W || !H) return;
  const show = (v) => (m === "cost" ? money(v) : fmt(v));
  const L = 48, B = 24, T = 8;
  const slot = (W - L) / buckets.length, bw = Math.min(slot * .64, 24);
  let svg = `<svg width="${W}" height="${H}" role="img" aria-label="${m === "cost" ? "Cost" : "Tokens"} per day"><defs>`;
  buckets.forEach((k, i) => {
    if (!sums[i]) return;
    const h = (H - B - T) * sums[i] / max, x = L + i * slot + (slot - bw) / 2;
    svg += `<clipPath id="c${i}"><rect x="${x}" y="${H - B - h}" width="${bw}" height="${h + 4}" rx="${Math.min(4, bw / 3)}"/></clipPath>`;
  });
  svg += `</defs>`;
  for (let i = 0; i <= ticks; i++) {
    const y = T + (H - B - T) * (1 - i / ticks);
    svg += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--border)" ${i ? 'stroke-dasharray="2 4"' : ""}/>`;
    svg += `<text x="${L - 12}" y="${y + 4}" text-anchor="end">${show(step * i)}</text>`;
  }
  const every = Math.ceil(buckets.length / Math.max(1, Math.floor((W - L) / 44)));
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  buckets.forEach((k, i) => {
    const x = L + i * slot + slot / 2;
    const label = hourly ? String(new Date(k + ":00:00Z").getHours()).padStart(2, "0") + ":00"
      : (([y, mo, d]) => `${+d} ${MONTHS[mo - 1]}`)(k.split("-"));
    if ((buckets.length - 1 - i) % every === 0) svg += `<text x="${x}" y="${H - 4}" text-anchor="middle">${label}</text>`;
    let y = H - B;
    svg += `<g clip-path="url(#c${i})">`;
    for (const model of order) {
      const v = stack[k][model] || 0;
      if (!v) continue;
      const h = (H - B - T) * v / max;
      y -= h;
      svg += `<rect x="${L + i * slot + (slot - bw) / 2}" y="${y}" width="${bw}" height="${h}" fill="${color[model]}"><title>${k} · ${esc(model)}: ${show(v)}</title></rect>`;
    }
    svg += `</g>`;
  });
  box.innerHTML = svg + "</svg>";
}

function renderFindings() {
  const fs = state.data.findings;
  if (!fs.length) { $("findings").innerHTML = `<div class="empty">Nothing wasteful found in this period.</div>`; return; }
  fill($("findings"), fs.map((f) => {
    const value = f.cost ? money(f.cost) : `${fmt(f.tokens)} tokens`;
    const full = Object.values(f.fix)[0];
    return `<div class="finding" title="${esc(full)}"><div class="top"><span class="title">${esc(f.title)}</span>
      <span class="cost num">${value}</span></div><div class="tip">${md(f.short || full)}</div></div>`;
  }), null, $("findings-count"), (n) => `${n} found`);
}

// One project chosen: its most expensive sessions. Otherwise: projects.
function renderWhere() {
  const d = state.data, nm = names();
  const place = (name, value, share) => `<div class="place"><div class="item"><span class="name">${name}</span>
    <span class="v num"><b>${value}</b></span></div><div class="bar"><i style="width:${Math.max(1, Math.min(100, share * 100))}%"></i></div></div>`;
  if (state.project) {
    $("where-title").textContent = "Most expensive sessions";
    const ss = d.top_sessions, max = Math.max(...ss.map((s) => s.cost || 0), 1e-9);
    if (!ss.length) { $("where").innerHTML = `<div class="empty">No sessions.</div>`; return; }
    fill($("where"), ss.map((s, i) => place(state.private ? `Session ${i + 1}` : esc(s.title || s.id), money(s.cost), (s.cost || 0) / max)),
      null, $("where-count"), () => "");
    return;
  }
  $("where-title").textContent = "Projects";
  if (!d.projects.length) { $("where").innerHTML = `<div class="empty">No projects.</div>`; return; }
  const max = Math.max(...d.projects.map((p) => p.cost || 0), 1e-9);
  fill($("where"), d.projects.map((p) => place(esc(nm.project(p.project)), money(p.cost), (p.cost || 0) / max)),
    null, $("where-count"), (n) => `${d.totals.projects || n} in all`);
}

function setControls() {
  document.querySelectorAll("#period button").forEach((x) => x.classList.toggle("on", +x.dataset.days === state.days));
  document.querySelectorAll("#metric button").forEach((x) => x.classList.toggle("on", x.dataset.m === state.metric));
  $("private").setAttribute("aria-pressed", state.private);
}
document.querySelectorAll("#period button").forEach((b) => b.onclick = () => { state.days = +b.dataset.days; setControls(); load(); });
document.querySelectorAll("#metric button").forEach((b) => b.onclick = () => { state.metric = b.dataset.m; setControls(); renderChart(); });
$("project").onchange = (e) => { state.project = e.target.value; load(); };
$("private").onclick = () => {
  state.private = !state.private;
  store("kuakgan.private", state.private ? "1" : "0");
  setControls();
  if (state.data) render();
};

$("shot").onclick = () => {
  const btn = $("shot"), text = $("shot-text"), done = (msg) => { text.textContent = msg; setTimeout(() => { text.textContent = "Screenshot"; btn.disabled = false; }, 3500); };
  btn.disabled = true; text.textContent = "Taking picture…";
  const q = new URLSearchParams({ w: 1200, h: 630, days: state.days, metric: state.metric, private: state.private ? "1" : "0", theme: theme() });
  if (state.project) q.set("project", state.project);
  const png = fetch("/screenshot.png?" + q, { headers: { "X-Kuakgan": "shot" }, cache: "no-store" })
    .then((r) => r.ok ? r.blob() : Promise.reject(new Error(r.status === 501 ? "Needs Edge or Chrome" : `HTTP ${r.status}`)));
  // Handed to the clipboard straight away, so the click still counts as the user's own.
  // Only if copying is refused is the picture saved to Downloads instead.
  let copied;
  try { copied = navigator.clipboard.write([new ClipboardItem({ "image/png": png })]); } catch (e) { copied = Promise.reject(e); }
  copied.then(() => done("Copied"), () => png.then((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `kuakgan-${new Date().toISOString().slice(0, 10)}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    done("Saved to Downloads");
  })).catch((e) => done(e.message || "Failed"));
};

let resizeTimer;
// Watches the page itself, which also catches size changes that send no resize event.
new ResizeObserver(() => { fit(); clearTimeout(resizeTimer); resizeTimer = setTimeout(() => state.data && render(), 80); })
  .observe(document.documentElement);
fit();
setControls();
load();
if (!shotMode) setInterval(() => { if (!document.hidden) load(); }, 120000);
</script>
</body>
</html>
