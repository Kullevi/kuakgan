name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships Python 3.9, so that is the oldest version we promise.
          - { os: macos-latest, python: "3.9" }
          - { os: windows-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: The commands run on an empty computer
        run: |
          python kuakgan.py summary
          python kuakgan.py check --hook
          python kuakgan.py instructions
